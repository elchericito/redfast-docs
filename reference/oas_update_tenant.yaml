openapi: 3.0.1
info:
  title: Redfast Tenant API
  version: "1.0"
paths:
  /v1/tenants:
    patch:
      summary: Update a Redfast tenant
      description: Updates a Redfast tenant's information or public key.
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - external_tenant_id
                - partner_code
              properties:
                external_tenant_id:
                  type: string
                  description: Unique Partner Tenant ID
                  example: "tenant-123"
                partner_code:
                  type: string
                  description: Partner Code assigned by Redfast
                  example: "recurly"
                app_domain:
                  type: string
                  description: (Optional) Top-level domain of the app
                  example: "example.com"
                api_key:
                  type: string
                  description: (Optional) API key used for integration
                  example: "abcd1234apikey"
                jwt_public_key:
                  type: string
                  description: |
                    (Optional) RSA public key (PEM format, 2048–4096 bits).
                    Use newline characters (\n) for formatting.
                  example: |
                    -----BEGIN PUBLIC KEY-----
                    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7...
                    -----END PUBLIC KEY-----
      parameters:
        - in: header
          name: rf-secret
          required: true
          schema:
            type: string
          description: Shared secret provided by Redfast (separate secrets for Test and Production)
      responses:
        "200":
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: "updated"
                  external_tenant_id:
                    type: string
                    example: "tenant-123"
                  app_id:
                    type: string
                    example: "abc123app"
                  tag_url:
                    type: string
                    format: uri
                    example: "https://abc123app.redfastlabs.com/assets/redfast.js"
                  test_mode:
                    type: boolean
                    example: false
                  jwt_public_key:
                    type: string
                    description: Returned only if updated
                    example: |
                      -----BEGIN PUBLIC KEY-----
                      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7...
                      -----END PUBLIC KEY-----
                  jwt_public_key_updated_at:
                    type: string
                    format: date-time
                    example: "2025-02-18T17:02:26.000Z"
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized, invalid rf-secret
        "422":
          description: Unprocessable Entity (e.g. missing required fields or invalid data)
